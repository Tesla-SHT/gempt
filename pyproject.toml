[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gempt"
version = "0.1.0"
description = "Dual-mode GPT/Codex orchestrator, Magpie 3-tier router, and Antigravity plugin for Gemini-to-GPT delegation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gempt = "gempt.cli:main"

[tool.setuptools]
packages = ["gempt", "gempt.plugin_data", "gempt.plugin_data.templates"]
package-dir = {gempt = "src/gempt", "gempt.plugin_data" = "plugin", "gempt.plugin_data.templates" = "templates"}
include-package-data = false

[tool.setuptools.package-data]
gempt = ["workload.json", "mcp_app_live.html"]
"gempt.plugin_data" = ["plugin.json", "mcp_config.json", "hooks.json", "work_split_hook.py", "rules/*.md", "agents/*.md", "skills/*/SKILL.md", "skills/*/references/*.md"]
"gempt.plugin_data.templates" = ["gempt.config.example.json", "magpie-groups.template.json"]
