<!-- Generated by npm run build:mcp-app from mcp_app/. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>GemPT Live</title>
  <style>:root {
  color-scheme: light;
  --page: var(--color-background-primary, #f7f8f5);
  --surface: var(--color-background-secondary, #fff);
  --subtle: var(--color-background-tertiary, #eef1ed);
  --text: var(--color-text-primary, #1b2522);
  --muted: var(--color-text-secondary, #4c615a);
  --line: var(--color-border-primary, #d4ddd6);
  --accent: var(--color-text-success, #006548);
  --accent-bg: var(--color-background-success, #e1f4e9);
  --warning: var(--color-text-warning, #73470a);
  --warning-bg: var(--color-background-warning, #fff3d9);
  --warning-line: var(--color-border-warning, #eacb89);
  --danger: var(--color-text-danger, #9f282b);
  --ring: var(--color-ring-primary, #168364);
  --mono: ui-monospace, Consolas, monospace;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page: var(--color-background-primary, #171d1b);
  --surface: var(--color-background-secondary, #1e2824);
  --subtle: var(--color-background-tertiary, #26322e);
  --text: var(--color-text-primary, #edf2ed);
  --muted: var(--color-text-secondary, #b3c6bc);
  --line: var(--color-border-primary, #3c4b44);
  --accent: var(--color-text-success, #87ddb7);
  --accent-bg: var(--color-background-success, #203d31);
  --warning: var(--color-text-warning, #ffd386);
  --warning-bg: var(--color-background-warning, #352b1e);
  --warning-line: var(--color-border-warning, #75603b);
  --danger: var(--color-text-danger, #ffa4a4);
  --ring: var(--color-ring-primary, #76cfac);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 14px/1.55 var(--font-sans, system-ui, "Microsoft YaHei UI", sans-serif);
  overflow-wrap: anywhere;
}

button, select, textarea { font: inherit; color: inherit; }
button, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
button, select, textarea {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
}
button { padding: 4px 10px; min-height: 30px; cursor: pointer; }
button:hover:enabled { background: var(--subtle); }
button:disabled { opacity: .65; cursor: default; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
ul, ol, dl, dd, p, h1, h2 { margin: 0; }
h2 { font-size: 14px; font-weight: 650; }

.shell {
  width: min(100%, 1440px);
  min-height: 100vh;
  min-height: 100dvh;
  margin-inline: auto;
  padding: clamp(12px, 3vw, 28px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.top { display: grid; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.topline { display: flex; align-items: center; gap: 8px; min-width: 0; }
h1 { font-size: 20px; font-weight: 680; letter-spacing: -.035em; line-height: 1.2; }
.refresh { margin-inline-start: auto; flex: none; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--subtle);
  color: var(--muted);
  font-size: 12px;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge[data-state="running"], .badge[data-state="finished"] { background: var(--accent-bg); color: var(--accent); }
.badge[data-state="waiting_gemini"], .badge[data-state="outcome_unknown"] { background: var(--warning-bg); color: var(--warning); }
.badge[data-state="failed"], .badge[data-state="interrupted"] { color: var(--danger); }
.picker { display: flex; align-items: center; gap: 9px; }
.picker > span { flex: none; color: var(--muted); font-size: 13px; }
.picker select { width: 100%; min-height: 35px; padding: 4px 8px; }
.metrics { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .65fr); gap: 8px 12px; }
.metrics > div { min-width: 0; }
dt, .count { color: var(--muted); font-size: 12px; }
.metrics dd { font-size: 13px; font-variant-numeric: tabular-nums; }

.notice { padding: 8px 10px; border-inline-start: 2px solid var(--ring); background: var(--surface); }
.notice[data-error="true"] { border-color: var(--danger); color: var(--danger); }
.empty { color: var(--muted); padding: 24px 0; }
#run { display: grid; gap: 12px; }
.goal { padding: 9px 0 2px; }
summary { cursor: pointer; font-weight: 650; }
.goal .prose { margin-top: 8px; }
.prose { white-space: pre-wrap; }
.identifiers { margin-top: 10px; display: grid; gap: 5px; }
.identifiers > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: baseline; gap: 5px; }
.identifiers dd { font-size: 12px; }
.mono, code, pre { font-family: var(--mono); }
.id-copy, .file-link { text-align: start; background: transparent; border-color: transparent; }
.id-copy { padding: 1px 4px; min-height: 24px; max-width: 100%; color: var(--accent); }

.ask { padding: 12px; background: var(--warning-bg); border: 1px solid var(--warning-line); border-inline-start: 3px solid var(--warning-line); border-radius: 9px; }
.ask-heading, .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ask-heading { color: var(--warning); flex-wrap: wrap; }
.ask-heading code { font-size: 11px; }
#ask-question { margin-top: 7px; font-weight: 650; }
#ask-context { margin-top: 5px; }
.paths { padding: 0; list-style: none; }
#ask-media:not(:empty) { border-top: 1px solid var(--warning-line); margin-top: 8px; padding-top: 6px; font-size: 12px; }

.activity, .evidence { display: grid; gap: 12px; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.panel-heading, .panel > summary { min-height: 42px; padding: 9px 12px; }
.panel-heading, .panel[open] > summary { border-bottom: 1px solid var(--line); }
.panel-heading button { font-size: 12px; }
.transcript, .events, .commands, #files {
  max-height: clamp(220px, 54vh, 650px);
  overflow: auto;
}
.transcript { padding: 12px; line-height: 1.75; }
.transcript:focus-visible { outline-offset: -3px; }
.transcript[data-empty="true"], .placeholder { color: var(--muted); }
.events, .commands { list-style: none; padding: 0; }
.events > li, .commands > li, #files > li { padding: 8px 12px; }
.events > li + li, .commands > li + li, #files > li + li { border-top: 1px solid var(--line); }
.event-label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; }
.event-text { white-space: pre-wrap; }
pre { margin: 6px 0 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.command > summary { color: var(--muted); }
.command code { color: var(--text); font-weight: 450; }
.count, .exit { margin-inline-start: 4px; font-variant-numeric: tabular-nums; font-weight: 500; }
.exit { color: var(--accent); font-size: 12px; }
.exit[data-failed="true"] { color: var(--danger); }
.file-link { max-width: 100%; padding: 0; color: var(--accent); min-height: 26px; text-decoration: underline; text-underline-offset: 3px; }

.controls {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: 0 -4px 20px color-mix(in srgb, var(--page), transparent 30%);
  display: grid;
  gap: 6px;
}
.controls > label { font-size: 12px; color: var(--muted); font-weight: 650; }
.controls textarea { background: var(--page); width: 100%; padding: 6px 8px; resize: vertical; }
.control-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
#control-status { flex: 1 0 100%; font-size: 12px; color: var(--muted); }
#control-status:empty { display: none; }
.danger { color: var(--danger); }
.primary { background: var(--accent-bg); color: var(--accent); font-weight: 650; }
.primary:hover:enabled { background: var(--subtle); }
.clipboard { position: fixed; inset: 0 auto auto 0; width: 1px; height: 1px; opacity: 0; }

@media (min-width: 480px) {
  .metrics { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); }
  .identifiers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .identifiers > :first-child { grid-column: 1 / -1; }
  #control-status { flex: 1 1 6rem; }
}

@media (min-width: 820px) {
  .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
  .metrics { grid-column: 1 / -1; max-width: 700px; }
  .activity { grid-template-columns: minmax(0, 1.48fr) minmax(0, 1fr); }
  .evidence { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
}

<body>
  <main class="shell">
    <header class="top">
      <div class="topline">
        <h1>GemPT Live</h1>
        <span id="badge" class="badge">连接中</span>
        <button id="refresh" class="refresh" type="button" disabled>刷新</button>
      </div>
      <label class="picker" for="runs">
        <span>任务</span>
        <select id="runs" disabled><option>正在连接…</option></select>
      </label>
      <dl id="metrics" class="metrics" hidden>
        <div><dt>模型</dt><dd id="model"></dd></div>
        <div><dt>耗时</dt><dd id="elapsed"></dd></div>
        <div><dt>Token</dt><dd id="tokens"></dd></div>
        <div><dt>缓存命中</dt><dd id="cache"></dd></div>
      </dl>
    </header>

    <p id="notice" class="notice" role="status" hidden></p>
    <p id="empty" class="empty">正在连接 GemPT…</p>

    <section id="run" aria-label="任务详情" hidden>
      <details class="goal" open>
        <summary>任务目标</summary>
        <p id="goal" class="prose"></p>
        <dl class="identifiers">
          <div><dt>工作区</dt><dd id="workspace" class="mono"></dd></div>
          <div><dt>run_id</dt><dd><button class="id-copy mono" id="run-id" type="button" aria-label="复制 run_id"></button></dd></div>
          <div><dt>session_id</dt><dd><button class="id-copy mono" id="session-id" type="button" aria-label="复制 session_id"></button></dd></div>
        </dl>
      </details>

      <section id="ask" class="ask" aria-labelledby="ask-title" hidden>
        <div class="ask-heading">
          <h2 id="ask-title">正在等待 Gemini</h2>
          <code id="ask-reason"></code>
        </div>
        <p id="ask-question" class="prose"></p>
        <div id="ask-context" class="prose"></div>
        <ul id="ask-media" class="paths mono"></ul>
      </section>

      <div class="activity">
        <section class="panel output" aria-labelledby="output-title">
          <header class="panel-heading">
            <h2 id="output-title">GPT 输出</h2>
            <button id="copy-output" type="button" disabled>复制全文</button>
          </header>
          <div id="output" class="prose transcript" tabindex="0"></div>
        </section>
        <section class="panel timeline" aria-labelledby="timeline-title">
          <header class="panel-heading"><h2 id="timeline-title">实时时间线</h2></header>
          <ol id="timeline" class="events"></ol>
        </section>
      </div>
      <div class="evidence">
        <details class="panel" open>
          <summary>命令轨迹 <span id="command-count" class="count"></span></summary>
          <ul id="commands" class="commands"></ul>
        </details>
        <details class="panel" open>
          <summary>触及文件 <span id="file-count" class="count"></span></summary>
          <ul id="files" class="paths mono"></ul>
        </details>
      </div>
    </section>

    <section id="controls" class="controls" aria-label="控制当前回合" hidden>
      <label for="steer">纠偏</label>
      <textarea id="steer" rows="2" placeholder="给当前 GPT 回合补充指令"></textarea>
      <div class="control-actions">
        <span id="control-status" role="status"></span>
        <button id="cancel-interrupt" type="button" hidden>取消</button>
        <button id="interrupt" class="danger" type="button">中止</button>
        <button id="send-steer" class="primary" type="button">发送纠偏</button>
      </div>
    </section>
  </main>
