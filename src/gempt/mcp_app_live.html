<!doctype html>
<!-- Generated by npm run build:mcp-app from mcp_app/. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>GemPT Live</title>
  <style>:root {
  color-scheme: light;
  --select-bg: #ffffff;
  --select-fg: #141416;
  --bg: var(--color-background-primary, #ffffff);
  --surface: var(--color-background-secondary, #f5f5f7);
  --surface-2: var(--color-background-tertiary, #eceef2);
  --fg: var(--color-text-primary, #141416);
  --muted: var(--color-text-secondary, #666a73);
  --faint: var(--color-text-tertiary, #8c909c);
  --border: var(--color-border-primary, rgba(20, 20, 22, 0.1));
  --border-soft: var(--color-border-secondary, rgba(20, 20, 22, 0.06));
  --ok: var(--color-text-success, #0f9d58);
  --warn: var(--color-text-warning, #c27803);
  --err: var(--color-text-danger, #d93025);
  --info: var(--color-text-info, #2563eb);
  --font: var(--font-sans, "Inter", "Segoe UI Variable", "Noto Sans SC", system-ui, sans-serif);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

:root[data-theme="light"] { color-scheme: light; }

:root[data-theme="dark"] {
  color-scheme: dark;
  --select-bg: #1c1c20;
  --select-fg: #f1f2f4;
  --bg: var(--color-background-primary, #141416);
  --surface: var(--color-background-secondary, #1c1c20);
  --surface-2: var(--color-background-tertiary, #26262c);
  --fg: var(--color-text-primary, #f1f2f4);
  --muted: var(--color-text-secondary, #9c9fa9);
  --faint: var(--color-text-tertiary, #737782);
  --border: var(--color-border-primary, rgba(255, 255, 255, 0.1));
  --border-soft: var(--color-border-secondary, rgba(255, 255, 255, 0.06));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --select-bg: #1c1c20;
    --select-fg: #f1f2f4;
    --bg: var(--color-background-primary, #141416);
    --surface: var(--color-background-secondary, #1c1c20);
    --surface-2: var(--color-background-tertiary, #26262c);
    --fg: var(--color-text-primary, #f1f2f4);
    --muted: var(--color-text-secondary, #9c9fa9);
    --faint: var(--color-text-tertiary, #737782);
    --border: var(--color-border-primary, rgba(255, 255, 255, 0.1));
    --border-soft: var(--color-border-secondary, rgba(255, 255, 255, 0.06));
  }
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.55 var(--font);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.mono { font-family: var(--mono); }

.shell, .view {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 0;
  overflow: hidden;
}

/* Ultra-slim 1-row sticky topbar */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  min-width: 0;
}

.list-heading {
  font-size: 12.5px;
  font-weight: 650;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.count-pill {
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  font: 600 11px/1.4 var(--mono);
  color: var(--muted);
}

.detail-title {
  margin: 0;
  flex: 1;
  min-width: 0;
  font: 620 12.5px/1.3 var(--font);
  color: var(--fg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  background: var(--faint);
}
.status-dot[data-state="running"],
.status-dot[data-state="queued"] {
  background: var(--info);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 22%, transparent);
}
.status-dot[data-state="waiting_gemini"] {
  background: var(--warn);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 24%, transparent);
}
.status-dot[data-state="finished"] { background: var(--ok); }
.status-dot[data-state="failed"],
.status-dot[data-state="interrupted"] { background: var(--err); }

.icon-btn, .btn-primary, .btn-danger, .btn-ghost, .copy-btn {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--fg);
  font: 500 11.5px/1 var(--font);
  cursor: pointer;
  white-space: nowrap;
}
.icon-btn {
  width: 24px;
  height: 24px;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 12px;
  color: var(--muted);
}
.back-btn {
  font-size: 16px;
  line-height: 1;
  color: var(--fg);
}
.icon-btn:hover, .copy-btn:hover { background: var(--surface-2); color: var(--fg); }
button:disabled { opacity: 0.45; cursor: default; }

/* Screen 1: Native Subagent Cards List */
.list-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px;
}

.session-cards {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  min-width: 0;
}
.session-cards > li { min-width: 0; max-width: 100%; }

.session-card {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 10px 11px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--fg);
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease;
}
.session-card:hover {
  background: var(--surface-2);
  border-color: color-mix(in srgb, var(--fg) 22%, var(--border));
}
.session-card[data-state="running"],
.session-card[data-state="queued"] {
  border-color: color-mix(in srgb, var(--info) 42%, var(--border));
}
.session-card[data-state="waiting_gemini"] {
  border-color: color-mix(in srgb, var(--warn) 58%, var(--border));
  background: color-mix(in srgb, var(--warn) 7%, var(--surface));
}

.sc-top {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  width: 100%;
}
.sc-glyph {
  flex: none;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
}
.sc-glyph[data-state="finished"] { color: var(--ok); }
.sc-glyph[data-state="failed"],
.sc-glyph[data-state="interrupted"] { color: var(--err); }
.sc-glyph .status-dot { width: 7px; height: 7px; }

.sc-title {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  font-weight: 620;
  color: var(--fg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sc-meta {
  flex: none;
  font: 500 11px/1 var(--mono);
  color: var(--muted);
  white-space: nowrap;
}
.sc-meta[data-state="running"],
.sc-meta[data-state="queued"] { color: var(--info); }
.sc-meta[data-state="waiting_gemini"] { color: var(--warn); }
.sc-chevron {
  flex: none;
  font-size: 15px;
  line-height: 1;
  color: var(--faint);
}

.sc-preview {
  margin: 0;
  padding-left: 23px;
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sc-preview.is-cmd { font-family: var(--mono); font-size: 11px; }
.sc-preview.is-ask { color: var(--warn); font-weight: 550; }
.sc-preview.is-err { color: var(--err); }

/* Multi-turn switcher inside a resumed GPT session */
.turn-strip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  overflow-x: auto;
  scrollbar-width: none;
}
.turn-strip::-webkit-scrollbar { display: none; }
.turn-pill {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font: 500 11px/1 var(--font);
  cursor: pointer;
}
.turn-pill:hover { background: var(--surface-2); color: var(--fg); }
.turn-pill[aria-selected="true"] {
  background: color-mix(in srgb, var(--info) 14%, var(--surface));
  border-color: color-mix(in srgb, var(--info) 45%, var(--border));
  color: var(--fg);
  font-weight: 600;
}
.turn-pill .status-dot { width: 6px; height: 6px; box-shadow: none; }

/* Collapsible metadata drawer (hidden by default) */
.meta-drawer {
  flex: none;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-size: 11.5px;
  color: var(--muted);
  display: grid;
  gap: 6px;
}
.meta-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 12px;
}
.meta-grid em, .meta-grid strong { font-style: normal; font-weight: 600; color: var(--fg); }
.meta-goal summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.goal-text {
  margin: 6px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--fg);
  max-height: 160px;
  overflow-y: auto;
}
.id-list {
  display: grid;
  gap: 3px;
  margin: 4px 0 0;
}
.id-list > div { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.id-list dt { color: var(--faint); width: 48px; flex: none; }
.id-list dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.id-copy {
  border: 0;
  background: transparent;
  color: var(--info);
  padding: 0;
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  text-align: left;
  overflow-wrap: anywhere;
}

.notice {
  flex: none;
  margin: 0;
  padding: 6px 12px;
  font-size: 11.5px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  color: var(--muted);
}
.notice[data-error="true"] {
  color: var(--err);
  background: color-mix(in srgb, var(--err) 10%, var(--bg));
}

.empty {
  flex: 1;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 8px;
  padding: 24px;
  color: var(--muted);
  text-align: center;
}
.empty p { margin: 0; font-size: 12.5px; }

/* Main chronological subagent feed */
.feed-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 12px 16px;
}

.ask-card {
  margin: 10px 0 0;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border));
  background: color-mix(in srgb, var(--warn) 10%, var(--bg));
  max-width: 100%;
}
.ask-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 12px;
  color: var(--warn);
}
.ask-head code { font-family: var(--mono); font-size: 11px; }
.ask-q { margin: 0; font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
.ask-ctx { margin: 6px 0 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }

.stream {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  width: 100%;
}
.stream > li { min-width: 0; max-width: 100%; }

/* Compact step rows (reasoning / command / files) */
.step-row {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--surface);
  font-size: 12px;
}
.step-row > summary {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  cursor: pointer;
  list-style: none;
  min-width: 0;
}
.step-row > summary::-webkit-details-marker { display: none; }
.step-icon { flex: none; font-size: 11px; width: 14px; text-align: center; color: var(--muted); }
.step-icon[data-tone="ok"] { color: var(--ok); }
.step-icon[data-tone="err"] { color: var(--err); }
.step-icon[data-tone="run"] { color: var(--info); }
.step-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--fg);
}
.step-title.is-muted { color: var(--muted); }
.step-meta { flex: none; font-size: 10.5px; color: var(--faint); font-family: var(--mono); }
.step-meta[data-failed="true"] { color: var(--err); }
.step-body {
  margin: 0;
  padding: 7px 9px;
  border-top: 1px solid var(--border-soft);
  font: 11.5px/1.5 var(--mono);
  color: var(--muted);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 220px;
  overflow-y: auto;
}
.step-body.is-prose { font-family: var(--font); color: var(--fg); }

.step-files {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  padding: 6px 9px;
}
.file-chips {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.file-chip {
  display: inline-block;
  max-width: 100%;
  padding: 2px 7px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  color: var(--fg);
  font: 11px/1.35 var(--mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
button.file-chip { cursor: pointer; color: var(--info); }
button.file-chip:hover { background: var(--surface-2); }

/* GPT Markdown messages */
.msg-block { min-width: 0; padding: 2px 2px 4px; }
.msg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.msg-role { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.copy-btn { padding: 2px 7px; font-size: 11px; }

.md { min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; }
.md h1, .md h2, .md h3, .md h4 {
  margin: 10px 0 6px;
  font-size: 13.5px;
  font-weight: 650;
  line-height: 1.35;
}
.md ul, .md ol { margin: 0 0 8px; padding-left: 18px; }
.md li { margin: 2px 0; }
.md code {
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--surface);
  font: 11.5px/1.4 var(--mono);
  overflow-wrap: anywhere;
  word-break: break-word;
}
.md pre {
  margin: 6px 0 8px;
  padding: 8px 10px;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--surface);
  overflow-x: auto;
  font: 11.5px/1.45 var(--mono);
}
.md pre code { padding: 0; background: transparent; }
.md blockquote {
  margin: 6px 0;
  padding: 2px 0 2px 10px;
  border-left: 2px solid var(--border);
  color: var(--muted);
}

.streaming-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 2px;
  font-size: 12px;
  color: var(--muted);
}

/* Slim 1-row sticky bottom composer */
.composer {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.steer-input {
  flex: 1;
  min-width: 120px;
  height: 28px;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--fg);
  font: 12.5px/1 var(--font);
}
.steer-input:focus { outline: none; border-color: var(--info); }
.btn-primary, .btn-danger, .btn-ghost { height: 28px; padding: 0 10px; }
.btn-primary {
  background: var(--fg);
  color: var(--bg);
  border-color: transparent;
}
.btn-danger {
  color: var(--err);
  border-color: color-mix(in srgb, var(--err) 40%, var(--border));
  background: transparent;
}
.btn-ghost { background: transparent; color: var(--muted); }
.ctrl-status { flex-basis: 100%; font-size: 11px; color: var(--muted); }
.ctrl-status[data-error="true"] { color: var(--err); }
</style>
</head>
<body>
  <main class="shell">
    <!-- Screen 1: Current conversation's GPT Subagent Sessions list -->
    <section id="view-list" class="view" aria-label="当前对话的 GPT 会话列表">
      <header class="topbar">
        <span class="list-heading">GPT Sessions</span>
        <span id="session-count" class="count-pill" hidden>0</span>
        <div class="top-actions">
          <button id="refresh-list" class="icon-btn" type="button" title="刷新" disabled>↻</button>
        </div>
      </header>

      <p id="notice-list" class="notice" role="status" hidden></p>

      <div id="empty" class="empty">
        <p id="empty-message" role="status">正在连接…</p>
      </div>

      <div id="list-wrap" class="list-wrap" hidden>
        <ul id="session-cards" class="session-cards"></ul>
      </div>
    </section>

    <!-- Screen 2: Native Subagent drill-in detail stream -->
    <section id="view-detail" class="view" aria-label="GPT 会话执行流" hidden>
      <header class="topbar">
        <button id="back-btn" class="icon-btn back-btn" type="button" title="返回当前对话的 GPT 会话列表" aria-label="返回列表">‹</button>
        <span id="dot" class="status-dot" title="连接中" aria-hidden="true"></span>
        <h1 id="detail-title" class="detail-title">GPT 会话</h1>
        <div class="top-actions">
          <button id="info-toggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="meta-drawer" title="会话信息" disabled>i</button>
          <button id="refresh" class="icon-btn" type="button" title="刷新" disabled>↻</button>
        </div>
      </header>

      <div id="turn-strip" class="turn-strip" role="tablist" aria-label="会话轮次" hidden></div>

      <section id="meta-drawer" class="meta-drawer" hidden>
        <div class="meta-grid">
          <span><em id="badge">连接中</em> · <span id="model">—</span> · <span id="elapsed">—</span></span>
          <span>Token <strong id="tokens">—</strong> · 缓存 <strong id="cache">—</strong></span>
        </div>
        <details id="goal-details" class="meta-goal">
          <summary>任务目标与标识</summary>
          <p id="goal" class="goal-text"></p>
          <dl class="id-list">
            <div><dt>工作区</dt><dd id="workspace" class="mono"></dd></div>
            <div><dt>run</dt><dd><button id="run-id" class="id-copy mono" type="button"></button></dd></div>
            <div><dt>session</dt><dd><button id="session-id" class="id-copy mono" type="button"></button></dd></div>
          </dl>
        </details>
      </section>

      <p id="notice" class="notice" role="status" hidden></p>

      <section id="feed-wrap" class="feed-wrap" aria-label="GPT 执行流">
        <ol id="stream" class="stream"></ol>
        <section id="ask" class="ask-card" aria-labelledby="ask-title" hidden>
          <div class="ask-head">
            <strong id="ask-title">等待主 Gemini 回复</strong>
            <code id="ask-reason"></code>
          </div>
          <p id="ask-question" class="ask-q"></p>
          <p id="ask-context" class="ask-ctx" hidden></p>
          <ul id="ask-media" class="file-chips" hidden></ul>
        </section>
      </section>

      <footer id="controls" class="composer" aria-label="控制当前回合" hidden>
        <input id="steer" class="steer-input" type="text" placeholder="给 GPT 补充指令…" autocomplete="off">
        <button id="send-steer" class="btn-primary" type="button">发送</button>
        <button id="cancel-interrupt" class="btn-ghost" type="button" hidden>取消</button>
        <button id="interrupt" class="btn-danger" type="button">中止</button>
        <span id="control-status" class="ctrl-status" role="status" hidden></span>
      </footer>
